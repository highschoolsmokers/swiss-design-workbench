<?xml version="1.0" encoding="UTF-8"?>
<!--
  svg-primer.svg — hand-authoring reference for this workbench.
  Open this file in two places at once: a text editor (to read the comments
  which ARE the cheat sheet) and a browser (to see each snippet render).

  Coordinate system:
    - 0,0 is the TOP-LEFT of the viewBox.
    - y increases DOWNWARDS (not up, unlike math graphs).
    - Bare numbers = "user units". Because viewBox is in mm here, 1 unit = 1 mm.

  Paint:
    - fill = interior paint. Default is black. Use fill="none" to skip.
    - stroke = outline paint. Default is none. Pair with stroke-width.
    - stroke-width is in user units (mm here), not pixels.
    - currentColor inherits the element's color (useful for themed icons).

  Fonts in standalone SVG:
    - A browser opening this file directly will NOT have Inter unless the
      SVG imports it. The <style> block below does that.
    - For PRINT delivery, convert <text> to <path> (outline the type) so
      downstream tools don't need the font installed.

  viewBox = A2 portrait (420 × 594 mm), same as the piece template so the
  examples are shown at print scale.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 594"
     width="420mm" height="594mm">

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap");
    text { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .label  { font-size: 2.4; font-weight: 500; letter-spacing: 0.24; fill: #0A0A0A; fill-opacity: 0.6; }
    .caption{ font-size: 3;   font-weight: 400; fill: #0A0A0A; }
  </style>

  <!-- Paper. -->
  <rect width="420" height="594" fill="#F5F3EE"/>

  <!-- Masthead — positioned by eye, flush left, aligned to the 20 mm margin. -->
  <g id="masthead">
    <text x="20" y="32" font-size="10" font-weight="700" letter-spacing="-0.15" fill="#0A0A0A">
      SVG Primer
    </text>
    <text x="20" y="40" font-size="3" font-weight="400" fill="#0A0A0A" fill-opacity="0.6">
      Primitives at mm scale. Comments in the source are the reference.
    </text>
    <line x1="20" y1="48" x2="400" y2="48" stroke="#0A0A0A" stroke-width="0.4"/>
  </g>

  <!-- ===================================================================
       1. RECT — filled and stroked rectangles.
       Attributes: x, y = top-left corner; width, height.
       fill, stroke, stroke-width optional.
       =================================================================== -->
  <g id="ex-rect" transform="translate(20 64)">
    <text class="label" x="0" y="0">RECT</text>
    <!-- Filled rect, 40 × 24 mm, flush at the group origin. -->
    <rect x="0" y="4" width="40" height="24" fill="#0A0A0A"/>
    <!-- Stroked rect, no fill, 2 mm line. -->
    <rect x="48" y="4" width="40" height="24" fill="none" stroke="#0A0A0A" stroke-width="1"/>
    <text class="caption" x="96" y="18">
      &lt;rect x y width height fill stroke stroke-width /&gt;
    </text>
  </g>

  <!-- ===================================================================
       2. LINE — a single straight stroke from (x1,y1) to (x2,y2).
       stroke is required; fill is ignored.
       =================================================================== -->
  <g id="ex-line" transform="translate(20 104)">
    <text class="label" x="0" y="0">LINE</text>
    <!-- Thin hairline, 0.2 mm. -->
    <line x1="0" y1="14" x2="88" y2="14" stroke="#0A0A0A" stroke-width="0.2"/>
    <!-- Thick rule, 2 mm. -->
    <line x1="0" y1="22" x2="88" y2="22" stroke="#0A0A0A" stroke-width="2"/>
    <text class="caption" x="96" y="18">
      &lt;line x1 y1 x2 y2 stroke stroke-width /&gt;
    </text>
  </g>

  <!-- ===================================================================
       3. CIRCLE — cx, cy = center; r = radius. All in user units (mm).
       For ellipses use <ellipse cx cy rx ry/> instead.
       =================================================================== -->
  <g id="ex-circle" transform="translate(20 144)">
    <text class="label" x="0" y="0">CIRCLE</text>
    <!-- Filled — accent, used once. -->
    <circle cx="14" cy="18" r="12" fill="#E30613"/>
    <!-- Stroked — ink outline. -->
    <circle cx="46" cy="18" r="12" fill="none" stroke="#0A0A0A" stroke-width="1"/>
    <text class="caption" x="96" y="18">
      &lt;circle cx cy r fill stroke /&gt;
    </text>
  </g>

  <!-- ===================================================================
       4. TEXT — x, y anchor the BASELINE of the first glyph by default.
       font-size in user units (mm here). font-family / weight are CSS.
       text-anchor = "start" | "middle" | "end" to set horizontal alignment.
       =================================================================== -->
  <g id="ex-text" transform="translate(20 184)">
    <text class="label" x="0" y="0">TEXT</text>
    <text x="0" y="16" font-size="14.82" font-weight="700" letter-spacing="-0.3" fill="#0A0A0A">
      Aa
    </text>
    <text x="24" y="16" font-size="8.46" font-weight="500" fill="#0A0A0A">
      Aa
    </text>
    <text x="40" y="16" font-size="3.53" font-weight="400" fill="#0A0A0A">
      Aa body 10 pt
    </text>
    <text class="caption" x="96" y="12">
      &lt;text x y font-size font-weight fill&gt;Aa&lt;/text&gt;
    </text>
    <text class="caption" x="96" y="18" fill-opacity="0.6">
      Sizes: 42 pt / 24 pt / 10 pt. y is the baseline, not the top.
    </text>
  </g>

  <!-- ===================================================================
       5. G — group elements. A transform on the group moves/scales/rotates
       all children together. Child coordinates become RELATIVE to the group.
       Common transforms:
         transform="translate(x y)"
         transform="rotate(deg cx cy)"
         transform="scale(sx sy)"
       Chain with spaces: transform="translate(20 10) rotate(-45)".
       =================================================================== -->
  <g id="ex-g" transform="translate(20 224)">
    <text class="label" x="0" y="0">G</text>
    <!-- This inner group is translated, so its rect+text share a local origin. -->
    <g transform="translate(0 4)">
      <rect x="0" y="0" width="88" height="24" fill="#0A0A0A"/>
      <text x="4" y="16" font-size="6" font-weight="500" fill="#F5F3EE">grouped</text>
    </g>
    <text class="caption" x="96" y="18">
      &lt;g transform="translate(x y)"&gt; … &lt;/g&gt;
    </text>
  </g>

  <!-- ===================================================================
       6. PATH — the general shape primitive. `d` is a mini-language:
         M x y   moveTo (pen up, then down)
         L x y   lineTo
         H x     horizontal lineTo
         V y     vertical lineTo
         C x1 y1 x2 y2 x y   cubic Bezier
         Q x1 y1 x y         quadratic Bezier
         A rx ry rot laf sf x y   arc
         Z                   close the subpath
       Lowercase versions (m, l, c, z …) are RELATIVE to the current point.
       =================================================================== -->
  <g id="ex-path" transform="translate(20 264)">
    <text class="label" x="0" y="0">PATH</text>
    <!-- Filled triangle: move, line, line, close. -->
    <path d="M 0 28 L 40 4 L 40 28 Z" fill="#0A0A0A"/>
    <!-- Stroked curve: move, cubic Bezier. -->
    <path d="M 48 28 C 56 4, 72 4, 88 28" fill="none" stroke="#0A0A0A" stroke-width="1"/>
    <text class="caption" x="96" y="12">
      &lt;path d="M x y L x y Z" fill /&gt;
    </text>
    <text class="caption" x="96" y="18" fill-opacity="0.6">
      M moveTo · L lineTo · C cubic Bezier · Z close.
    </text>
  </g>

  <!-- ===================================================================
       7. COORDINATES CHEAT — a small diagram showing that y increases DOWN.
       =================================================================== -->
  <g id="ex-coords" transform="translate(20 308)">
    <text class="label" x="0" y="0">COORDS</text>
    <!-- Axes. -->
    <line x1="0" y1="4"  x2="0"  y2="36" stroke="#0A0A0A" stroke-width="0.4"/>
    <line x1="0" y1="4"  x2="48" y2="4"  stroke="#0A0A0A" stroke-width="0.4"/>
    <!-- Arrowheads via tiny triangles. -->
    <path d="M 48 4 L 45 2.5 L 45 5.5 Z" fill="#0A0A0A"/>
    <path d="M 0 36 L -1.5 33 L 1.5 33 Z" fill="#0A0A0A"/>
    <!-- Labels. -->
    <text class="caption" x="52" y="6">x →</text>
    <text class="caption" x="-1" y="42">y ↓</text>
    <!-- Origin dot. -->
    <circle cx="0" cy="4" r="0.8" fill="#E30613"/>
    <text class="caption" x="4" y="12" fill-opacity="0.6">0,0 is top-left</text>
    <text class="caption" x="96" y="18">
      y grows DOWN. This is the most common beginner trap.
    </text>
  </g>

  <!-- ===================================================================
       8. COMMON ATTRIBUTES (source-only reference — no render).

       Shape attributes:
         fill              "#RRGGBB" | "none" | "currentColor"
         fill-opacity      0…1
         stroke            same as fill
         stroke-width      number (user units)
         stroke-linecap    "butt" | "round" | "square"
         stroke-linejoin   "miter" | "round" | "bevel"
         stroke-dasharray  "2 2" etc. (user units)
         opacity           0…1 (applies to fill AND stroke)

       Text attributes:
         font-size         number (user units = mm here)
         font-weight       100…900 (400 regular, 500 medium, 700 bold)
         font-family       inherited from <style> in this file
         letter-spacing    number or em
         text-anchor       "start" (default) | "middle" | "end"
         dominant-baseline "auto" | "middle" | "central" | "hanging"

       Units:
         - Bare numbers are user units. With viewBox="0 0 420 594",
           1 user unit = 1 mm rendered at any output size.
         - width/height on <svg> (e.g. "420mm") set the rendered size.
         - Inside SVG, avoid px/pt unless you know the conversion
           (1 pt = 0.3528 mm at 72 dpi; 1 px = 0.2646 mm at 96 dpi).

       Grouping & reuse:
         <defs> … </defs>   declare reusable things (patterns, symbols)
         <symbol id="x"> … </symbol>  reusable shape
         <use href="#x" x y /> spawn a copy
         <pattern id="p" …> … </pattern>  tileable fill

       Accessibility:
         <title>Short label</title> inside any shape → tooltip / a11y name.
         <desc>Longer description</desc>
         role="img" aria-label="…" on the root <svg> for documents.
       =================================================================== -->

  <!-- Footer rule + signature. -->
  <line x1="20" y1="570" x2="400" y2="570" stroke="#0A0A0A" stroke-width="0.4"/>
  <text x="20" y="578" class="label">
    SWISS DESIGN WORKBENCH · SVG PRIMER · VIEWBOX = MM
  </text>

</svg>
